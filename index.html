<div id="app">
<header class="topbar">
  <div class="brand"><div class="logo">▣</div><div class="titlebox"><div class="appname">LAYOUT STUDIO</div><input id="projectTitle" class="project-title" value="Untitled design" aria-label="Project name" /></div></div>

</div>

  positionStage();e.preventDefault();
 }
},{passive:false});
function finishStagePointer(e){if(!activePointers.has(e.pointerId))return;activePointers.delete(e.pointerId);
 if(gesture?.mode==='pinch'&&activePointers.size===1){const p=[...activePointers.values()][0];gesture={mode:'pan',id:p.id,startX:p.x,startY:p.y,startPanX:panX,startPanY:panY};try{W.setPointerCapture(p.id);}catch(_){ }}
 else if(!activePointers.size)gesture=null;
 else if(gesture?.mode==='pan'&&gesture.id===e.pointerId)gesture=null;
}
W.addEventListener('pointerup',finishStagePointer);W.addEventListener('pointercancel',finishStagePointer);
W.addEventListener('wheel',e=>{if(e.target.closest('.canvas-tools'))return;e.preventDefault();
 if(e.ctrlKey||e.metaKey)setScale(scale*Math.exp(-e.deltaY*.01),false,{x:e.clientX,y:e.clientY});
 else {panX-=e.deltaX;panY-=e.deltaY;autoFit=false;positionStage();}
},{passive:false});
board.addEventListener('pointerdown',startDrag);board.addEventListener('pointermove',dragMove);board.addEventListener('pointerup',dragEnd);board.addEventListener('pointercancel',dragEnd);
board.addEventListener('dblclick',e=>{const n=e.target.closest('.wire-item');if(n){select(getGroupIds(n.dataset.id));setTab('edit');let f=document.querySelector('#pane-edit [data-prop="text"]');if(f)f.focus();}});
$('undo').onclick=undo;$('redo').onclick=redo;$('saveTop').onclick=()=>setTab('project');$('fit').onclick=fit;$('zoomLabel').onclick=fit;$('zoomIn').onclick=()=>setScale(scale*1.2,false);$('zoomOut').onclick=()=>setScale(scale/1.2,false);
$('focusBtn').onclick=()=>viewAction('focus');$('panTool').onclick=()=>viewAction('pan');$('handlesTool').onclick=()=>viewAction('handles');
$('snap').onclick=()=>doProjectAction('snap');$('grid').onclick=()=>doProjectAction('grid');$('multi').onclick=()=>{multiMode=!multiMode;$('multi').classList.toggle('active',multiMode);toast(multiMode?'Multi-select ON — tap elements':'Multi-select OFF');};$('preview').onclick=()=>{preview=!preview;$('preview').classList.toggle('active',preview);$('preview').textContent=preview?'◉':'◉';renderItems();toast(preview?'Preview mode — tap icon again to edit':'Editing mode');};
$('importInput').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());const imported=validateProject(data);if(project.items.length&&!confirm('Open this project and replace the current canvas? Export the existing project first if needed.'))return;checkpoint();project=imported;selected=[];autoFit=true;refresh();persist();toast(`Opened ${imported.name}`);}catch(err){alert('Could not open project: '+err.message);}finally{e.target.value='';}});
$('imageInput').addEventListener('change',e=>{const f=e.target.files?.[0],it=mainSelected();if(!f||!it||it.kind!=='image')return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=el('canvas'),max=1400,r=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);checkpoint();it.imageData=c.toDataURL('image/jpeg',.86);renderItems();persist();toast('Image added');};img.src=reader.result;};reader.readAsDataURL(f);e.target.value='';});
// Palette pointer drag onto canvas; simple taps also add items.
document.querySelector('#pane-add').addEventListener('pointerdown',e=>{const button=e.target.closest('.component');if(!button)return;paletteDrag={id:e.pointerId,kind:button.dataset.kind,button,startX:e.clientX,startY:e.clientY,active:false,ghost:null};});
window.addEventListener('pointermove',e=>{const d=paletteDrag;if(!d||d.id!==e.pointerId)return;if(!d.active&&Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>14){d.active=true;d.ghost=el('div');d.ghost.className='drag-ghost';d.ghost.textContent=readable(d.kind);document.body.append(d.ghost);}if(d.active){d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';}});
window.addEventListener('pointerup',e=>{const d=paletteDrag;if(!d||d.id!==e.pointerId)return;paletteDrag=null;if(!d.active)return;d.ghost?.remove();d.button.dataset.dragged='yes';setTimeout(()=>d.button.dataset.dragged='',200);
 const r=board.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){const [t,w,h]=defaults[d.kind];addItem(d.kind,(e.clientX-r.left)/scale-w/2,(e.clientY-r.top)/scale-h/2,{openEdit:true});}else toast('Drop onto the canvas, or tap to add');});
window.addEventListener('pointercancel',()=>{paletteDrag?.ghost?.remove();paletteDrag=null;});
window.addEventListener('keydown',e=>{const target=e.target,typing=target.matches('input,textarea,select,[contenteditable]');if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}if(typing)return;
 if((e.key==='Delete'||e.key==='Backspace')&&selected.length){e.preventDefault();operation('delete');}else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'&&selected.length){e.preventDefault();operation('duplicate');}else if(e.key==='Escape'){selected=[];applySelected();}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)&&selected.length){e.preventDefault();checkpoint();let dx=0,dy=0,s=e.shiftKey?10:1;if(e.key==='ArrowLeft')dx=-s;if(e.key==='ArrowRight')dx=s;if(e.key==='ArrowUp')dy=-s;if(e.key==='ArrowDown')dy=s;for(const it of selected.map(getItem)){if(!it||it.locked)continue;it.x=clamp(it.x+dx,0,project.width-it.w);it.y=clamp(it.y+dy,0,project.height-it.h);}renderItems();renderInspector();persist();}});
window.addEventListener('resize',()=>{document.body.classList.toggle('panels-collapsed',window.innerWidth<=800&&!panelOpen);if(autoFit)fit();else positionStage();});
// Initialise existing autosaved design.
try{let saved=localStorage.getItem('layout-studio-autosave');if(saved)project=validateProject(JSON.parse(saved));}catch(err){/* start with blank project */}
rebuildPalette();setTab(window.innerWidth<801?'add':'edit');if(window.innerWidth<=800)panelOpen=false;applyPanelUI();refresh();
})();
</script>
