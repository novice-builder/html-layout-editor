window.addEventListener('keydown',e=>{const target=e.target,typing=target.matches('input,textarea,select,[contenteditable]');if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}if(typing)return;
 if((e.key==='Delete'||e.key==='Backspace')&&selected.length){e.preventDefault();operation('delete');}else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'&&selected.length){e.preventDefault();operation('duplicate');}else if(e.key==='Escape'){selected=[];applySelected();}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)&&selected.length){e.preventDefault();checkpoint();let dx=0,dy=0,s=e.shiftKey?10:1;if(e.key==='ArrowLeft')dx=-s;if(e.key==='ArrowRight')dx=s;if(e.key==='ArrowUp')dy=-s;if(e.key==='ArrowDown')dy=s;for(const it of selected.map(getItem)){if(!it||it.locked)continue;it.x=clamp(it.x+dx,0,project.width-it.w);it.y=clamp(it.y+dy,0,project.height-it.h);}renderItems();renderInspector();persist();}});
window.addEventListener('resize',()=>{document.body.classList.toggle('panels-collapsed',window.innerWidth<=800&&!panelOpen);if(autoFit)fit();else positionStage();});
// Initialise existing autosaved design.
try{let saved=localStorage.getItem('layout-studio-autosave');if(saved)project=validateProject(JSON.parse(saved));}catch(err){/* start with blank project */}
layoutInset=project.layoutInset??16;layoutGap=project.layoutGap??12;rebuildPalette();updateToolButtons();setTab(window.innerWidth<801?'add':'edit');if(window.innerWidth<=800)panelOpen=false;applyPanelUI();refresh();
// V5: device-size canvas is 1:1 with actual screen CSS pixels, even behind the controls.
const previousPositionStage=positionStage;
positionStage=function(){previousPositionStage();if(document.activeElement!==$('zoomLabel'))$('zoomLabel').value=rnd(scale*100)+'%';};
$('fit').onclick=()=>{
 const [w,h]=screenSize(),changed=project.width!==w||project.height!==h;
 if(changed){checkpoint();project.width=w;project.height=h;project.items.forEach(it=>{it.w=clamp(it.w,minDimension(it,'w'),w);it.h=clamp(it.h,minDimension(it,'h'),h);it.x=clamp(it.x,0,w-it.w);it.y=clamp(it.y,0,h-it.h);});}
 autoFit=false;scale=1;refresh();
 // The board starts at the device's top-left; remaining regions are reachable by panning.
 panX=(project.width-W.clientWidth)/2;panY=(project.height-W.clientHeight)/2;positionStage();
 if(changed)persist();toast('Device screen '+w+' × '+h+' · 100% zoom');
};
// Each press changes to the next 10-point boundary: 89 -> 90 -> 100, 107 -> 100.
const zoomByStep=direction=>{const pct=Math.round(scale*10000)/100;const target=direction>0?(Math.floor((pct+.0001)/10)+1)*10:(Math.ceil((pct-.0001)/10)-1)*10;setScale(clamp(target,8,500)/100,false);};
$('zoomIn').onclick=()=>zoomByStep(1);$('zoomOut').onclick=()=>zoomByStep(-1);
const applyZoomInput=()=>{const input=$('zoomLabel'),raw=input.value.trim().replace('%','').replace(',','.').trim(),pct=Number(raw);
 if(!raw||!Number.isFinite(pct)||pct<=0){input.value=rnd(scale*100)+'%';toast('Enter a zoom percentage such as 100 or 75');return;}
 const value=clamp(pct,8,500);setScale(value/100,false);input.value=(Math.round(value*100)/100)+'%';if(value!==pct)toast('Zoom limit: 8%–500%');
};
$('zoomLabel').onclick=null;
$('zoomLabel').addEventListener('focus',e=>e.target.select());
$('zoomLabel').addEventListener('change',applyZoomInput);
$('zoomLabel').addEventListener('blur',()=>{if(!$('zoomLabel').value.endsWith('%'))applyZoomInput();});
$('zoomLabel').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();}if(e.key==='Escape'){e.preventDefault();e.target.value=rnd(scale*100)+'%';e.target.blur();}});
positionStage();
})();
</script>
