<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Toolbar Docking Test</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui;background:#f8fafc;touch-action:none}#canvas{position:fixed;inset:0;background-image:linear-gradient(#e9eef5 1px,transparent 1px),linear-gradient(90deg,#e9eef5 1px,transparent 1px);background-size:24px 24px}#bar{position:fixed;left:50%;top:80%;display:flex;align-items:center;gap:5px;padding:6px;border-radius:14px;background:#1e293b;color:white;box-shadow:0 8px 25px #0003;transform-origin:0 0;touch-action:none;z-index:10;user-select:none;transition:opacity .15s,scale .15s}#bar.vertical{flex-direction:column}#bar.dragging{opacity:.5;scale:.85;transition:opacity .12s,scale .12s}button{border:0;background:#334155;color:white;border-radius:9px;width:40px;height:40px;font-size:20px;touch-action:none}#grip{cursor:grab;color:#e2e8f0}#bar.hidden{padding:3px;background:transparent;box-shadow:none}#bar.hidden button:not(#eye){display:none}#bar.hidden #eye{opacity:.45;background:#334155}#targets{position:fixed;inset:0;pointer-events:none;display:none;z-index:4}.target{position:absolute;border:2px dashed #0d9488;border-radius:12px;background:#0d948822;opacity:.65;display:grid;place-items:center;color:#0f766e;font-size:12px;font-weight:700}.target.active{background:#0d948866;border-style:solid;opacity:1}.top,.bottom{width:100px;height:44px;left:calc(50% - 50px)}.top{top:max(8px,env(safe-area-inset-top))}.bottom{bottom:max(8px,env(safe-area-inset-bottom))}.left,.right{width:44px;height:100px;top:calc(50% - 50px);writing-mode:vertical-rl}.left{left:8px}.right{right:8px}#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);width:100%;text-align:center;color:#64748b;font-size:12px;pointer-events:none}#bar.hidden~#hint{opacity:.35}
</style></head><body><div id="canvas"></div><div id="targets"><div class="target top" data-side="top">TOP</div><div class="target bottom" data-side="bottom">BOTTOM</div><div class="target left" data-side="left">LEFT</div><div class="target right" data-side="right">RIGHT</div></div><div id="bar"><button id="grip" aria-label="Drag toolbar">⠿</button><button aria-label="Add">＋</button><button aria-label="Select">↖</button><button aria-label="Settings">⚙</button><button id="eye" aria-label="Hide toolbar">◉</button></div><div id="hint">Drag the grip · Release on a highlighted target to dock</div><script>
const bar=document.querySelector('#bar'),grip=document.querySelector('#grip'),eye=document.querySelector('#eye'),targets=document.querySelector('#targets'),zones=[...document.querySelectorAll('.target')];let x=0,y=0,side='bottom',drag=null,active=null;const margin=8;
function size(){return {w:bar.offsetWidth,h:bar.offsetHeight}}function bound(){let {w,h}=size();x=Math.max(margin,Math.min(innerWidth-w-margin,x));y=Math.max(margin,Math.min(innerHeight-h-margin,y));draw()}function draw(){bar.style.left=x+'px';bar.style.top=y+'px'}function orient(s){side=s;bar.classList.toggle('vertical',s==='left'||s==='right')}function persist(){localStorage.setItem('toolbar-docking-v1',JSON.stringify({x,y,side,hidden:bar.classList.contains('hidden')}))}
function dock(s){orient(s);const {w,h}=size();if(s==='top'){x=(innerWidth-w)/2;y=Math.max(margin,parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-top'))||margin)}if(s==='bottom'){x=(innerWidth-w)/2;y=innerHeight-h-margin}if(s==='left'){x=margin;y=(innerHeight-h)/2}if(s==='right'){x=innerWidth-w-margin;y=(innerHeight-h)/2}bound();persist()}
function pick(px,py){let winner=null;for(const z of zones){const r=z.getBoundingClientRect();if(px>=r.left&&px<=r.right&&py>=r.top&&py<=r.bottom){winner=z.dataset.side;break}}zones.forEach(z=>z.classList.toggle('active',z.dataset.side===winner));return winner}
grip.addEventListener('pointerdown',e=>{e.preventDefault();grip.setPointerCapture(e.pointerId);const r=grip.getBoundingClientRect();drag={id:e.pointerId,offsetX:e.clientX-r.left,offsetY:e.clientY-r.top};bar.classList.add('dragging');targets.style.display='block';active=pick(e.clientX,e.clientY)});
grip.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const factor=.85;const gLeft=grip.offsetLeft,gTop=grip.offsetTop;x=e.clientX-(gLeft+drag.offsetX)*factor;y=e.clientY-(gTop+drag.offsetY)*factor;bound();active=pick(e.clientX,e.clientY)});
function finish(e){if(!drag||drag.id!==e.pointerId)return;drag=null;bar.classList.remove('dragging');targets.style.display='none';zones.forEach(z=>z.classList.remove('active'));if(active)dock(active);else{bound();persist()}active=null}
grip.addEventListener('pointerup',finish);grip.addEventListener('pointercancel',finish);
eye.addEventListener('click',()=>{const h=bar.classList.toggle('hidden');eye.textContent=h?'◌':'◉';eye.setAttribute('aria-label',h?'Show toolbar':'Hide toolbar');bound();persist()});
window.addEventListener('resize',()=>{bound();persist()});try{const s=JSON.parse(localStorage.getItem('toolbar-docking-v1'));if(s){orient(s.side||'bottom');x=s.x;y=s.y;if(s.hidden){bar.classList.add('hidden');eye.textContent='◌'}}else{x=(innerWidth-bar.offsetWidth)/2;y=innerHeight-bar.offsetHeight-70}}catch(e){x=(innerWidth-bar.offsetWidth)/2;y=innerHeight-bar.offsetHeight-70}bound();
</script></body></html>
