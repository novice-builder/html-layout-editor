<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9ecf0">
<title>Layout Studio — Original Transparent Device Mockups</title>
<style>
:root{color-scheme:light;--grey:#e9ecf0;--accent:#4669f5}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--grey);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.app{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden}
.device-switch{position:absolute;z-index:10;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:white;border:1px solid #d9dee7;border-radius:15px;box-shadow:0 5px 18px #18213617}
.device-switch button{width:50px;height:44px;display:grid;place-items:center;appearance:none;border:0;border-radius:10px;color:#626c80;background:transparent;cursor:pointer;touch-action:manipulation}
.device-switch button[aria-pressed="true"]{color:white;background:var(--accent)}
.device-switch button:focus-visible{outline:3px solid #263d9d;outline-offset:2px}
.device-switch button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stage{position:absolute;top:calc(env(safe-area-inset-top,0px) + 81px);left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.slot{position:relative;flex:none}
.device{position:absolute;left:0;top:0;transform-origin:top left;will-change:transform}
.screen{position:absolute;background:#fff;overflow:hidden;isolation:isolate;contain:layout paint;transform:translateZ(0)}
.screen iframe{display:block;position:absolute;inset:0;border:0;background:white;width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.frame-image{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}
.drop-hint{position:absolute;inset:0;z-index:12;display:none;place-items:center;background:#e9ecf0d9;font-size:16px;font-weight:600;color:#465368;pointer-events:none}
.app.dragging .drop-hint{display:grid}
</style>
</head>

<button type="button" data-device="tablet" aria-label="Tablet" aria-pressed="false" title="Tablet"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="1.7" width="14" height="20.6" rx="2.2"/><path d="M11.5 19.1h1"/></svg></button>
<button type="button" data-device="phone" aria-label="Phone" aria-pressed="true" title="Phone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.7" y="1.5" width="10.6" height="21" rx="2.3"/><path d="M10.4 4.2h3.2"/></svg></button>
</nav>

const defaultPage="<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>\n*{box-sizing:border-box}html,body{margin:0;min-width:0;width:100%;}\nbody{min-height:260vh;background:#fff;background-image:linear-gradient(#e9edf2 1px,transparent 1px),linear-gradient(90deg,#e9edf2 1px,transparent 1px);background-size:20px 20px;}\n/* every ten squares a slightly darker guide helps identify scroll movement */\nbody:before{content:\"\";pointer-events:none;position:absolute;top:0;left:0;width:100%;height:260vh;background-image:linear-gradient(#cfd8e2 1px,transparent 1px),linear-gradient(90deg,#cfd8e2 1px,transparent 1px);background-size:200px 200px;opacity:.42}\n<\/style><\/head><body><\/body><\/html>";
const samplePage="<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>\n*{box-sizing:border-box}html,body{margin:0;min-width:0}body{font-family:system-ui,-apple-system,sans-serif;background:#f4f5f8;color:#202738}\nnav{position:sticky;top:0;z-index:2;background:#fff;color:#222b3d;padding:18px 24px;border-bottom:1px solid #e1e5ee;display:flex;justify-content:space-between;align-items:center;gap:12px}nav strong{font-size:18px}.pill{font-size:12px;color:#3159ad;background:#e5ecff;border-radius:50px;padding:7px 11px}main{max-width:1020px;margin:auto;padding:35px 24px 110px}h1{font-size:clamp(30px,5vw,64px);letter-spacing:-.045em;line-height:1.07;margin:0 0 15px}p{line-height:1.55;color:#5d697e}.hero{border-radius:24px;background:#e4eaf9;padding:40px;margin-bottom:24px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e5e8ee;padding:24px;border-radius:16px;min-height:220px}.card strong{font-size:18px}.card button{cursor:pointer;background:#2457bd;color:#fff;border:0;padding:13px 17px;border-radius:9px}footer{position:fixed;bottom:0;right:0;left:0;background:#202738;color:white;text-align:center;padding:12px 18px;font-size:13px}button{font-size:inherit}\n@media(max-width:700px){main{padding:18px 14px 95px}.hero{padding:22px;border-radius:18px}.cards{grid-template-columns:1fr}.card{min-height:160px}h1{font-size:34px}nav{padding:12px 14px}}\n<\/style><\/head><body><nav><strong>Responsive sample<\/strong><span class=\"pill\">Sticky header<\/span><\/nav><main><section class=\"hero\"><h1>A real webpage inside the mockup.<\/h1><p>This page scrolls independently, uses responsive CSS breakpoints, and has a fixed footer. Switch devices without changing the underlying design.<\/p><\/section><section class=\"cards\"><article class=\"card\"><strong>Responsive layout<\/strong><p>Three columns on desktop, one on narrow screens.<\/p><button type=\"button\" onclick=\"this.textContent='It works!'\">Try button<\/button><\/article><article class=\"card\"><strong>Scrolling<\/strong><p>Scroll the page. The transparent PNG mockup remains fixed in position.<\/p><\/article><article class=\"card\"><strong>True viewport<\/strong><p id=\"size\"><\/p><script>function update(){document.getElementById('size').textContent=innerWidth+' × '+innerHeight+' CSS px'}window.addEventListener('resize',update);update()<\/script><\/article><\/section><section style=\"height:950px;padding-top:55px\"><h2>Keep scrolling<\/h2><p>The fixed footer and sticky header remain inside the screen.<\/p><\/section><\/main><footer>Fixed inside the device viewport<\/footer><\/body><\/html>";
const stage=document.getElementById('stage');
const slot=document.getElementById('slot');
const device=document.getElementById('device');
const screen=document.getElementById('screen');
const canvas=document.getElementById('canvas');
const frameImage=document.getElementById('frameImage');
const app=document.getElementById('app');
const buttons=[...document.querySelectorAll('[data-device]')];
let active='phone';
let dragDepth=0;
const hasDemo=new URLSearchParams(location.search).get('demo')==='1';
canvas.srcdoc=hasDemo?samplePage:defaultPage;

function fit(){
 const p=presets[active];
 // Match the image's transparent screen opening exactly to the required CSS viewport.
 const xScale=p.width/p.holeW,yScale=p.height/p.holeH;
 const outerWidth=p.imgW*xScale,outerHeight=p.imgH*yScale;
 const aw=stage.clientWidth,ah=stage.clientHeight;
 if(!aw||!ah)return;
 // Scale the entire visual mockup, never the iframe's actual layout dimensions.
 const scale=Math.min(1,aw/outerWidth,ah/outerHeight);
 slot.style.width=(outerWidth*scale)+'px';
 slot.style.height=(outerHeight*scale)+'px';
 device.style.width=outerWidth+'px';
 device.style.height=outerHeight+'px';
 device.style.transform='scale('+scale+')';
 screen.style.left=(p.holeX*xScale)+'px';
 screen.style.top=(p.holeY*yScale)+'px';
 screen.style.width=p.width+'px';
 screen.style.height=p.height+'px';
 screen.style.borderRadius=p.radius+'px';
 // Explicit iframe dimensions: CSS media queries/sticky/fixed positions use these.
 canvas.style.width=p.width+'px';
 canvas.style.height=p.height+'px';
}
function setDevice(name){
 if(!Object.prototype.hasOwnProperty.call(presets,name))return;
 active=name;
 buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device===name)));
 frameImage.src=presets[name].image;
 fit();
}
buttons.forEach(b=>b.addEventListener('click',()=>setDevice(b.dataset.device)));
if('ResizeObserver'in window)new ResizeObserver(fit).observe(stage);
window.addEventListener('resize',fit,{passive:true});
window.addEventListener('orientationchange',fit,{passive:true});

// Minimal UI remains 3 icon buttons. Drop a self-contained HTML file on the
// page to preview it; alternatively developers can call LayoutStudioMockup.setHtml().
window.addEventListener('dragenter',e=>{if(!e.dataTransfer||!Array.from(e.dataTransfer.types).includes('Files'))return;e.preventDefault();dragDepth++;app.classList.add('dragging')});
window.addEventListener('dragover',e=>{if(e.dataTransfer&&Array.from(e.dataTransfer.types).includes('Files'))e.preventDefault()});
window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)app.classList.remove('dragging')});
window.addEventListener('drop',async e=>{
 e.preventDefault();dragDepth=0;app.classList.remove('dragging');
 const f=[...(e.dataTransfer?.files||[])].find(x=>/\.html?$/i.test(x.name));
 if(f)canvas.srcdoc=await f.text();
});
window.LayoutStudioMockup=Object.freeze({
 setDevice, setHtml(html){canvas.removeAttribute('src');canvas.srcdoc=String(html)},
 setUrl(url){canvas.removeAttribute('srcdoc');canvas.src=String(url)},
